version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agc_newsletter
      POSTGRES_USER: agc
      POSTGRES_PASSWORD: agc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://agc:agc_dev_password@db:5432/agc_newsletter?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: super-long-local-dev-secret-change-in-production

volumes:
  pgdata:
